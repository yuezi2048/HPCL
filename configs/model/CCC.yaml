embedding_size: 64
feat_embed_dim: 64

n_mm_layers: 1
n_layers: 2
knn_k: 10
mm_image_weight: 0.1
learning_rate: [0.0001]
reg_weight: [0.001]

#dropout: [0.3 0.5]
#dropout: [0.1, 0.3, 0.5, 0.7]
dropout: [0.5]

#mask_weight_f: [1, 2]
#mask_weight_f: [1, 1.5, 2, 2.5, 3]
mask_weight_f: [1.5]

#mask_weight_g: [0, 0.01, 0.1]
#mask_weight_g: [0.01, 0.001, 0]
mask_weight_g: [0.001]

#align_weight: [0.1, 0.2, 0.3]
align_weight: [0.1]

#temp: [0.2, 0.4, 0.8]
#temp: [0.2, 0.4, 0.6]
#temp: [0.1]

lambda_1 : [0.01] # 解耦损失权重
infoNCETemp : [0.2, 0.4]

# ==================================================
# 新增：扩散模型 (Diffusion Model) 参数
# ==================================================
# Denoise 模型的 MLP 隐藏层维度
# Denoise 模型结构为: [input_dim] -> hidden_dims -> [output_dim]
# input_dim 和 output_dim 会自动设为 embedding_size * 2 (即 128)
diff_hidden_dims: [256, 128]

# 时间步嵌入 (Time Embedding) 的维度
diff_time_emb_size: 10

# Denoise 模型是否使用归一化
diff_norm: False

# 扩散过程的总步数 (训练时)
diff_steps: 5

# 噪声调度的缩放、最小值和最大值
diff_noise_scale: 0.1
diff_noise_min: 0.0001
diff_noise_max: 0.02

# 采样 (推理时) 的步数 (应 <= diff_steps)
diff_sampling_steps: 5

# 采样 (推理时) 是否添加噪声
diff_sampling_noise: False

# 扩散损失 (MSE) 的权重
diff_loss_weight: [0.1]

# 扩散指导损失 (GC Loss) 的权重
gc_loss_weight: [0.1]

hyper_parameters: ["reg_weight", "learning_rate", 'dropout', 'mask_weight_f', 'mask_weight_g', 'align_weight', 'lambda_1', 'infoNCETemp', 'diff_loss_weight', 'gc_loss_weight']